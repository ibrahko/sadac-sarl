{% extends "backoffice/base_bo.html" %}

{% block title %}Confirmer la suppression – SADAC{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-lg-5">
    <div class="card bo-delete-card">
      <div class="card-header">
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Confirmer la suppression
        </h5>
      </div>
      <div class="card-body p-4 text-center">
        <div class="mb-4">
          <span class="rounded-circle d-inline-flex align-items-center
                       justify-content-center"
                style="width:80px;height:80px;background:rgba(239,68,68,0.1);">
            <i class="bi bi-trash text-danger" style="font-size:2.5rem;"></i>
          </span>
        </div>
        <h5 class="fw-bold mb-2">Êtes-vous sûr ?</h5>
        <p class="text-muted mb-4">
          Cette action est <strong>irréversible</strong>.
          L'élément sera définitivement supprimé.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-3 justify-content-center">
            <button type="submit" class="btn btn-bo-danger px-4">
              <i class="bi bi-trash me-2"></i>Supprimer
            </button>
            <a href="javascript:history.back()"
               class="btn btn-outline-secondary px-4">
              <i class="bi bi-arrow-left me-2"></i>Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
